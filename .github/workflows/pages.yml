# Publishes webapp/static as a GitHub Pages site (browser-direct mode: the page calls
# api.typesafe.ai itself with a key the viewer pastes in; nothing secret is in the repo).
# Enable once: repo Settings -> Pages -> Source: "GitHub Actions".
name: Deploy playground to GitHub Pages
on:
  push:
    branches: [claude/typesafeai-trial-vt2wg9, main]
    paths: [webapp/static/**, .github/workflows/pages.yml]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: ${{ steps.deployment.outputs.page_url }} }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: webapp/static }
      - id: deployment
        uses: actions/deploy-pages@v4
