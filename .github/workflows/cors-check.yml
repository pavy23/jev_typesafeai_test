# Answers one question from a GitHub-hosted runner (which has open internet):
# does api.typesafe.ai allow browser (CORS) calls from a GitHub Pages origin?
# No API key needed: the preflight and the CORS headers on a 401 tell the story.
name: CORS check against api.typesafe.ai
on: { workflow_dispatch: {} }
jobs:
  cors:
    runs-on: ubuntu-latest
    steps:
      - name: Preflight (OPTIONS) as the Pages origin would send it
        run: |
          set -x
          curl -sS -i -X OPTIONS https://api.typesafe.ai/v1/systemone \
            -H "Origin: https://pavy23.github.io" \
            -H "Access-Control-Request-Method: POST" \
            -H "Access-Control-Request-Headers: authorization,content-type" \
            --max-time 20 | sed -n '1,40p'
      - name: Actual POST with Origin header (no key -> expect 401, look for access-control-allow-origin)
        run: |
          set -x
          curl -sS -i -X POST https://api.typesafe.ai/v1/systemone \
            -H "Origin: https://pavy23.github.io" \
            -H "Content-Type: application/json" \
            -d '{"state":"x","model":"jev-latest","questions":{"q":{"type":"noul","instructions":"?"}}}' \
            --max-time 20 | sed -n '1,40p'
      - name: GET /v1/models with Origin header
        run: |
          set -x
          curl -sS -i https://api.typesafe.ai/v1/models -H "Origin: https://pavy23.github.io" --max-time 20 | sed -n '1,40p'
      - name: Verdict
        run: |
          H=$(curl -sS -i -X OPTIONS https://api.typesafe.ai/v1/systemone \
                -H "Origin: https://pavy23.github.io" -H "Access-Control-Request-Method: POST" \
                -H "Access-Control-Request-Headers: authorization,content-type" --max-time 20 | tr -d '\r' | tr 'A-Z' 'a-z')
          if echo "$H" | grep -q '^access-control-allow-origin:'; then
            echo "::notice::CORS ALLOWED -> GitHub Pages direct mode can work"; echo "$H" | grep '^access-control-'
          else
            echo "::warning::NO access-control-allow-origin header -> browser direct calls will be blocked; use a server (Codespaces/Render)"
          fi
