# Render Blueprint: one-click hosting for the playground (free instance).
# https://render.com/deploy?repo=https://github.com/pavy23/jev_typesafeai_test
services:
  - type: web
    name: typesafe-playground
    runtime: python
    plan: free
    buildCommand: pip install -e .
    startCommand: python webapp/app.py --auto --host 0.0.0.0
    healthCheckPath: /api/status
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: TYPESAFE_API_KEY
        sync: false          # entered in the Render dashboard, never stored in git
      - key: PLAYGROUND_PASSWORD
        sync: false          # browser login prompt so the URL is not open to everyone
